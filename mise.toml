[tools]
actionlint = "1.7.12"
bun = "1.3.14"
changie = "1.26.0"
swiftformat = "0.62.1"
swiftlint = "0.65.0"
xcodegen = "2.46.0"

[tasks.change]
description = "Add a user-facing change fragment"
run = "changie new"

[tasks."lint:localization"]
description = "Check localization keys and translations"
run = "bun scripts/lint-localization.ts"

[tasks."audit:zero-copy"]
description = "Check the record path for CPU pixel readback"
run = "bun scripts/audit-zero-copy.ts"
