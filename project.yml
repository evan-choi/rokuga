name: Rokuga
options:
  bundleIdPrefix: io.rokuga
  developmentLanguage: en
  knownRegions: [en, ko, ja, zh-Hans]
  deploymentTarget:
    macOS: "13.3"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  RokugaCore:
    path: RokugaCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.3"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Rokuga:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    entitlements:
      path: App/Rokuga.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Rokuga
        CFBundleDisplayName: Rokuga
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.3"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.video
        NSMicrophoneUsageDescription: Rokuga records your voice only when you enable microphone capture for a recording.
        NSHumanReadableCopyright: © 2026 Rokuga contributors. MIT License.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: RokugaCore
        products:
          - CaptureKit
          - EncoderKit
          - EffectsKit
          - TrimKit
          - SettingsKit
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rokuga.Rokuga
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Rokuga:
    build:
      targets:
        Rokuga: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RokugaCore/CaptureKitTests
        - package: RokugaCore/SettingsKitTests
