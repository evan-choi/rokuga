name: Rokuga
options:
  bundleIdPrefix: io.rokuga
  developmentLanguage: en
  knownRegions: [en, ko, ja, zh-Hans]
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  RokugaCore:
    path: RokugaCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.1

# Signing lives in Configs/Signing.xcconfig (ad-hoc by default so anyone can
# clone & build; run scripts/setup-dev-signing.sh for a persistent identity).
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Hardened runtime blocks debugger attach; Release-only (Debug keeps get-task-allow).
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  Rokuga:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    entitlements:
      path: App/Rokuga.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Rokuga
        CFBundleDisplayName: Rokuga
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.video
        NSMicrophoneUsageDescription: Rokuga records your voice only when you enable microphone capture for a recording.
        NSHumanReadableCopyright: © 2026 Rokuga contributors. Apache License 2.0.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: RokugaCore
        products:
          - CaptureKit
          - EncoderKit
          - TrimKit
          - SettingsKit
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evan-choi.rokuga
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(ROKUGA_PROVISIONING_PROFILE_SPECIFIER)

  RokugaPerf:
    type: application
    platform: macOS
    sources:
      - path: Perf/Sources
    entitlements:
      path: Perf/RokugaPerf.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Perf/Info.plist
      properties:
        CFBundleName: RokugaPerf
        CFBundleDisplayName: RokugaPerf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
    dependencies:
      - package: RokugaCore
        products:
          - CaptureKit
          - EncoderKit
          - SettingsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rokuga.Rokuga.Perf

schemes:
  Rokuga:
    build:
      targets:
        Rokuga: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RokugaCore/CaptureKitTests
        - package: RokugaCore/SettingsKitTests

  RokugaPerf:
    build:
      targets:
        RokugaPerf: all
    run:
      config: Release
    profile:
      config: Release
