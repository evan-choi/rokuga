included:
  - App/Sources
  - RokugaCore/Sources
  - RokugaCore/Tests

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1
  max_length: 50

type_body_length:
  warning: 400

file_length:
  warning: 600

function_body_length:
  warning: 80

cyclomatic_complexity:
  warning: 15

nesting:
  type_level: 2
