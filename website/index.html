          <p><a href="https://github.com/evan-choi/rokuga">View Rokuga on GitHub</a></p>

        <section>

            <li>Record a selected area, full screen, or individual window.</li>
            <li>Encode H.264 or H.265 video to MP4 or MOV at up to 5K.</li>
            <li>Match the recording frame rate to the display.</li>
            <li>Record without time limits or watermarks.</li>
          </ul>
        </section>
        <section>
          <h2>Download</h2>
          <p>Install Rokuga now with Homebrew. The Mac App Store release is coming soon.</p>
          <p><code>brew install --cask evan-choi/tap/rokuga</code></p>
          <p>Rokuga requires macOS 15 Sequoia or later and is free.</p>
