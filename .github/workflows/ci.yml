name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    # Spec targets macOS 13.3+; GitHub retired hosted macos-13 runners,
    # so 13.x coverage moves to the QA matrix (task 10.5) on self-hosted hardware.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"

      - name: RokugaCore unit tests
        working-directory: RokugaCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Rokuga.xcodeproj \
            -scheme Rokuga \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: Localization gates (no literals outside catalog, ko/ja/zh-Hans completeness)
        run: python3 scripts/lint-localization.py

  benchmarks:
    name: Performance gates
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"

      - name: Baseline frame-transport audit
        run: ./scripts/audit-zero-copy.sh

      - name: Benchmark gate unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run benchmarks (1080p60 short run + latency)
        working-directory: RokugaCore
        run: |
          swift run -c release rokuga-bench throughput --width 1920 --height 1080 --fps 60 --seconds 10 > /tmp/tp.json
          swift run -c release rokuga-bench latency > /tmp/lat.json

      # Shared runners are noisy: absolute spec budgets gate hard; the >10% baseline
      # regression check uses the committed local-hardware baseline as reference only.
      - name: Enforce gates (task 10.4)
        run: python3 scripts/bench-gate.py /tmp/tp.json /tmp/lat.json
