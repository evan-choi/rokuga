name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    # Spec targets macOS 13.3+; GitHub retired hosted macos-13 runners,
    # so 13.x coverage moves to the QA matrix (task 10.5) on self-hosted hardware.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"

      - name: RokugaCore unit tests
        working-directory: RokugaCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Rokuga.xcodeproj \
            -scheme Rokuga \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

  benchmarks:
    name: Benchmarks (scaffold)
    # Perf regression gates get wired in task 10.4 — until then this job only
    # verifies the benchmark harness builds.
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder
        run: echo "Benchmark harness lands with task 10.4 (4K60 drop-rate, A/V drift, CPU/memory budgets)"
