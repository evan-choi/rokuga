name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)/Contents/Developer"

      - name: RokugaCore unit tests
        run: mise run --skip-tools core:test

      - name: Generate project
        run: mise run --skip-tools xcode-project:generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Rokuga.xcodeproj \
            -scheme Rokuga \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: actionlint bun changie swiftformat swiftlint

      - name: Repository lint checks
        run: mise run --skip-tools repository:lint
