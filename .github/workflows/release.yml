name: Release

# Uploads the Mac App Store build and publishes a notarized .app.zip for Homebrew.
#
# Required repository or `release` environment secrets:
#   APPLE_CERTIFICATE_BASE64                  - Developer ID Application cert (.p12, base64)
#   APPLE_CERTIFICATE_PASSWORD                - password of the Developer ID .p12
#   APP_STORE_APP_CERTIFICATE_BASE64          - Apple Distribution cert (.p12, base64)
#   APP_STORE_INSTALLER_CERTIFICATE_BASE64    - Mac Installer Distribution cert (.p12, base64)
#   APP_STORE_CERTIFICATE_PASSWORD            - password shared by the App Store .p12 files
#   APP_STORE_PROVISIONING_PROFILE_BASE64     - Mac App Store profile (.provisionprofile, base64)
#   APPLE_TEAM_ID                             - Apple Developer team ID
#   APPLE_API_KEY_ID                          - App Store Connect API key ID
#   APPLE_API_ISSUER_ID                       - App Store Connect API issuer ID
#   APPLE_API_KEY_P8_BASE64                   - App Store Connect API private key (.p8, base64)
#   HOMEBREW_TAP_TOKEN                        - token with Contents write access to evan-choi/homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a manual build or App Store retry
        required: true
        default: "1.0"
      deploy:
        description: Deploy the manual build to App Store Connect and Homebrew
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Rokuga
  APP_BUNDLE_ID: com.evan-choi.rokuga
  APP_STORE_APP_ID: "6803412533"

jobs:
  release:
    name: App Store & Homebrew
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)/Contents/Developer"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing material
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_APP_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_APP_CERTIFICATE_BASE64 }}
          APP_STORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          DEPLOY: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.deploy }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          if [[ "$DEPLOY" == true ]]; then
            APP_CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
            INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/mac-installer-distribution.p12"
            PROFILE_PATH="$RUNNER_TEMP/app-store.provisionprofile"
            PROFILE_PLIST="$RUNNER_TEMP/app-store-profile.plist"
            echo -n "$APP_STORE_APP_CERTIFICATE_BASE64" | base64 --decode -o "$APP_CERTIFICATE_PATH"
            echo -n "$APP_STORE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$INSTALLER_CERTIFICATE_PATH"
            echo -n "$APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
            security import "$APP_CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
              -P "$APP_STORE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security import "$INSTALLER_CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
              -P "$APP_STORE_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
            PROFILE_DESTINATION="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
            mkdir -p "$(dirname "$PROFILE_DESTINATION")"
            cp "$PROFILE_PATH" "$PROFILE_DESTINATION"
            echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
            echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
            rm "$APP_CERTIFICATE_PATH" "$INSTALLER_CERTIFICATE_PATH" "$PROFILE_PATH"
          fi

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$CERTIFICATE_PATH"

      - name: Archive for App Store
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          xcodebuild archive \
            -project Rokuga.xcodeproj \
            -scheme Rokuga \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME-AppStore.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ROKUGA_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Verify App Store archive signatures
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        run: |
          APP_PATH="$RUNNER_TEMP/$APP_NAME-AppStore.xcarchive/Products/Applications/$APP_NAME.app"
          BUNDLE_PATH="$APP_PATH/Contents/Resources/KeyboardShortcuts_KeyboardShortcuts.bundle"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | grep -q '^Authority=Apple Distribution:'
          codesign -d --extract-certificates="$RUNNER_TEMP/archive-app-cert" "$APP_PATH"
          codesign -d --extract-certificates="$RUNNER_TEMP/archive-bundle-cert" "$BUNDLE_PATH"
          cmp "$RUNNER_TEMP/archive-app-cert0" "$RUNNER_TEMP/archive-bundle-cert0"

      - name: Create App Store package
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        run: |
          APP_PATH="$RUNNER_TEMP/$APP_NAME-AppStore.xcarchive/Products/Applications/$APP_NAME.app"
          mkdir -p "$RUNNER_TEMP/app-store-export"
          productbuild --component "$APP_PATH" /Applications \
            --sign "3rd Party Mac Developer Installer" \
            "$RUNNER_TEMP/app-store-export/$APP_NAME.pkg"

      - name: Verify exported App Store package
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        id: app_store_package
        run: |
          PACKAGE_PATH=$(find "$RUNNER_TEMP/app-store-export" -maxdepth 1 -name '*.pkg' -print -quit)
          [[ -n "$PACKAGE_PATH" ]]
          pkgutil --expand-full "$PACKAGE_PATH" "$RUNNER_TEMP/app-store-package"
          APP_PATH=$(find "$RUNNER_TEMP/app-store-package" -type d -path '*/Payload/Rokuga.app' -print -quit)
          [[ -n "$APP_PATH" ]]
          BUNDLE_PATH="$APP_PATH/Contents/Resources/KeyboardShortcuts_KeyboardShortcuts.bundle"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | grep -q '^Authority=Apple Distribution:'
          codesign -d --extract-certificates="$RUNNER_TEMP/package-app-cert" "$APP_PATH"
          codesign -d --extract-certificates="$RUNNER_TEMP/package-bundle-cert" "$BUNDLE_PATH"
          cmp "$RUNNER_TEMP/package-app-cert0" "$RUNNER_TEMP/package-bundle-cert0"
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          PACKAGE_PATH: ${{ steps.app_store_package.outputs.package_path }}
        run: |
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode \
            -o "$API_PRIVATE_KEYS_DIR/AuthKey_$APPLE_API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR
          xcrun altool --upload-package "$PACKAGE_PATH" \
            --platform macos \
            --apple-id "$APP_STORE_APP_ID" \
            --bundle-id "$APP_BUNDLE_ID" \
            --bundle-version "$GITHUB_RUN_NUMBER" \
            --bundle-short-version-string "${{ steps.version.outputs.version }}" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Archive for Homebrew
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Rokuga.xcodeproj \
            -scheme Rokuga \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME-DeveloperID.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export Homebrew app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/DeveloperIDExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME-DeveloperID.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/DeveloperIDExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/homebrew-export"

      - name: Notarize Homebrew app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          APP_PATH="$RUNNER_TEMP/homebrew-export/$APP_NAME.app"
          SUBMISSION_ZIP="$RUNNER_TEMP/$APP_NAME-notarization.zip"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$SUBMISSION_ZIP"
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Verify notarized Homebrew app
        run: |
          APP_PATH="$RUNNER_TEMP/homebrew-export/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose=4 "$APP_PATH"

      - name: Create Homebrew ZIP
        id: zip
        run: |
          ZIP_FILENAME="$APP_NAME-${{ steps.version.outputs.version }}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_FILENAME"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/homebrew-export/$APP_NAME.app" "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_filename=$ZIP_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${{ steps.zip.outputs.zip_path }}" --clobber
          else
            gh release create "$TAG_NAME" \
              "${{ steps.zip.outputs.zip_path }}" \
              --title "$APP_NAME ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v') && !inputs.deploy"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.zip.outputs.zip_filename }}
          path: ${{ steps.zip.outputs.zip_path }}
          retention-days: 7

      - name: Clean up signing material
        if: always()
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$RUNNER_TEMP/private_keys"/AuthKey_*.p8
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
          fi
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  homebrew:
    name: Update Homebrew cask
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_REPOSITORY: evan-choi/homebrew-tap
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Update cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          TAG_NAME="v$VERSION"
          ASSET_NAME="$APP_NAME-$VERSION.zip"
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$ASSET_NAME"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$ASSET_NAME" "$ASSET_URL"
          SHA256=$(sha256sum "$RUNNER_TEMP/$ASSET_NAME" | cut -d' ' -f1)

          gh auth setup-git
          gh repo clone "$TAP_REPOSITORY" "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          mkdir -p Casks
          cat > Casks/rokuga.rb <<EOF
          cask "rokuga" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/evan-choi/rokuga/releases/download/v#{version}/Rokuga-#{version}.zip"
            name "Rokuga"
            desc "Native screen recorder for macOS"
            homepage "https://github.com/evan-choi/rokuga"

            depends_on macos: :sequoia

            app "Rokuga.app"
          end
          EOF

          if [[ -z "$(git status --porcelain -- Casks/rokuga.rb)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rokuga.rb
          git commit -m "chore: Rokuga $VERSION으로 업데이트"
          git push origin HEAD:main
