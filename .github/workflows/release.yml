name: Release

# Signs, notarizes, and publishes a .dmg to GitHub Releases.
#
# Required repository secrets (maintainer's Apple Developer account):
#   APPLE_CERTIFICATE_BASE64    - Developer ID Application cert (.p12, base64)
#   APPLE_CERTIFICATE_PASSWORD  - password of the .p12
#   APPLE_TEAM_ID               - Apple Developer team ID
#   APPLE_API_KEY_ID            - App Store Connect API key ID
#   APPLE_API_ISSUER_ID         - App Store Connect API issuer ID
#   APPLE_API_KEY_P8_BASE64     - App Store Connect API private key (.p8, base64)
#   HOMEBREW_TAP_TOKEN          - fine-grained token with Contents write access to evan-choi/homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Rokuga

jobs:
  release:
    name: Build, notarize & publish
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)/Contents/Developer"

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$CERTIFICATE_PATH"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Rokuga.xcodeproj \
            -scheme Rokuga \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify app signature
        run: |
          APP_PATH="$RUNNER_TEMP/export/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_FILENAME="$APP_NAME-$VERSION.dmg"
          DMG_TEMP="$RUNNER_TEMP/dmg-root"
          DMG_RW="$RUNNER_TEMP/$APP_NAME-rw.dmg"
          DMG_MOUNT="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$DMG_TEMP/.background" "$DMG_MOUNT"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"
          sips -s format png assets/dmg-background.svg \
            --out "$DMG_TEMP/.background/background.png" >/dev/null
          touch "$DMG_TEMP/.metadata_never_index"
          hdiutil create -volname "$APP_NAME" -srcfolder "$DMG_TEMP" \
            -ov -format UDRW "$DMG_RW"
          DEVICE=$(hdiutil attach -readwrite -noverify -noautoopen \
            -mountpoint "$DMG_MOUNT" "$DMG_RW" | awk '/^\/dev\// { print $1; exit }')
          trap 'hdiutil detach "$DEVICE" >/dev/null 2>&1 || true' EXIT
          osascript <<'APPLESCRIPT'
          tell application "Finder"
            tell disk "Rokuga"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {100, 100, 700, 460}
              set viewOptions to icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 96
              set text size of viewOptions to 14
              set background picture of viewOptions to file ".background:background.png"
              set position of item "Rokuga.app" of container window to {160, 205}
              set position of item "Applications" of container window to {440, 205}
              close
              open
              update without registering applications
              delay 2
            end tell
          end tell
          APPLESCRIPT
          sync
          hdiutil detach "$DEVICE"
          trap - EXIT
          hdiutil convert "$DMG_RW" -ov -format UDZO \
            -o "$RUNNER_TEMP/$DMG_FILENAME"
          codesign --force --sign "Developer ID Application" --timestamp \
            "$RUNNER_TEMP/$DMG_FILENAME"
          echo "dmg_path=$RUNNER_TEMP/$DMG_FILENAME" >> "$GITHUB_OUTPUT"
          echo "dmg_filename=$DMG_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Notarize & staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          rm "$API_KEY_PATH"
          xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}"

      - name: Verify notarized DMG
        run: |
          DMG_PATH="${{ steps.dmg.outputs.dmg_path }}"
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$DMG_PATH"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.dmg.outputs.dmg_path }}" \
            --title "$APP_NAME ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.dmg.outputs.dmg_filename }}
          path: ${{ steps.dmg.outputs.dmg_path }}
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  homebrew:
    name: Update Homebrew cask
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_REPOSITORY: evan-choi/homebrew-tap
    steps:
      - name: Update cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          ASSET_NAME="$APP_NAME-$VERSION.dmg"
          ASSET_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ASSET_NAME"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$ASSET_NAME" "$ASSET_URL"
          SHA256=$(sha256sum "$RUNNER_TEMP/$ASSET_NAME" | cut -d' ' -f1)

          gh auth setup-git
          gh repo clone "$TAP_REPOSITORY" "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          mkdir -p Casks
          cat > Casks/rokuga.rb <<EOF
          cask "rokuga" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/evan-choi/rokuga/releases/download/v#{version}/Rokuga-#{version}.dmg"
            name "Rokuga"
            desc "Native screen recorder for macOS"
            homepage "https://github.com/evan-choi/rokuga"

            depends_on macos: ">= :sequoia"

            app "Rokuga.app"
          end
          EOF

          if [[ -z "$(git status --porcelain -- Casks/rokuga.rb)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rokuga.rb
          git commit -m "chore: update Rokuga to $VERSION"
          git push origin HEAD:main
