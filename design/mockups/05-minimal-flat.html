<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rokuga — Minimal Flat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
  :root { --txt:#111318; --sub:#6f7480; --line:#e8e9ec; --accent:#ff3b30; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; background:#f4f4f6; color:var(--txt); }
  .badge { position:fixed; top:16px; left:16px; font-size:13px; font-weight:600; color:var(--sub); background:#fff; border:1px solid var(--line); padding:6px 14px; border-radius:6px; }
  .window { width:760px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 60px rgba(17,19,24,.08); overflow:hidden; }
  .titlebar { display:flex; align-items:center; gap:8px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .dot { width:12px; height:12px; border-radius:50%; background:#e3e4e8; }
  .title { flex:1; text-align:center; font-size:13px; font-weight:600; color:var(--sub); margin-right:56px; }
  .header { padding:28px 32px 0; }
  .h1 { font-size:26px; font-weight:900; letter-spacing:-.03em; }
  .h1 small{color:var(--sub); font-weight:500; font-size:14px; margin-left:12px; letter-spacing:0}
  .modes { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:20px 32px 0; }
  .mode { padding:16px 8px; text-align:center; cursor:pointer; border-right:1px solid var(--line); background:#fff; }
  .mode:last-child{border-right:none}
  .mode .label{font-size:13px; font-weight:600; margin-top:6px; color:var(--sub)}
  .mode .icon{font-size:20px}
  .mode.active { background:var(--txt); }
  .mode.active .label{color:#fff} .mode.active .icon{filter:grayscale(1) brightness(3)}
  .preview { margin:20px 32px 0; height:210px; border:1px solid var(--line); border-radius:10px; position:relative; background:#fafafb;
    display:flex; align-items:center; justify-content:center; }
  .hint{font-size:13px; color:var(--sub)}
  .marquee { position:absolute; inset:34px 64px; border:1.5px solid var(--txt); }
  .dims { position:absolute; top:10px; left:68px; font-size:11px; font-weight:600; background:var(--txt); color:#fff; padding:3px 8px; }
  .timer { position:absolute; bottom:12px; right:14px; font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; }
  .timer::before{content:'●'; color:var(--accent); margin-right:8px; animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}
  .controls { display:flex; align-items:center; gap:12px; padding:20px 32px; }
  .rec { display:flex; align-items:center; gap:10px; border:none; cursor:pointer; padding:0 26px; height:50px; border-radius:8px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:700; letter-spacing:.02em; }
  .rec .d{width:10px;height:10px;border-radius:50%;background:#fff}
  .ctl { width:50px; height:50px; border-radius:8px; cursor:pointer; font-size:15px; background:#fff; border:1px solid var(--line); color:var(--txt); }
  .ctl:hover{border-color:var(--txt)}
  .spacer{flex:1}
  .toggle { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600; cursor:pointer; padding:12px 0 12px 16px; }
  .sw{width:34px;height:20px;border-radius:99px;background:#d9dbe0;position:relative;transition:.2s}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on .sw{background:var(--txt)} .toggle.on .sw::after{transform:translateX(14px)}
  .statusbar{display:flex;align-items:center;gap:0;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
  .cell{padding:14px 20px;border-right:1px solid var(--line);font-weight:600}
  .path{margin-left:auto;border-right:none;padding-right:32px}
</style>
</head>
<body>
  <div class="badge">05 · Minimal Flat (Swiss)</div>
  <div class="window">
    <div class="titlebar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="title">Rokuga</div>
    </div>
    <div class="header"><div class="h1">Record<small>Free · No watermark · No time limit</small></div></div>
    <div class="modes">
      <div class="mode active"><div class="icon">⬚</div><div class="label">Selected Area</div></div>
      <div class="mode"><div class="icon">🖥</div><div class="label">Full Screen</div></div>
      <div class="mode"><div class="icon">🗔</div><div class="label">Window</div></div>
      <div class="mode"><div class="icon">📷</div><div class="label">Camera</div></div>
    </div>
    <div class="preview">
      <div class="marquee"></div>
      <div class="dims">1280 × 720</div>
      <div class="hint">Drag to select an area of the screen</div>
      <div class="timer">00:01:24</div>
    </div>
    <div class="controls">
      <button class="rec"><span class="d"></span>Start Recording</button>
      <button class="ctl">⏸</button>
      <button class="ctl">⏹</button>
      <div class="spacer"></div>
      <div class="toggle on"><span>System Audio</span><div class="sw"></div></div>
      <div class="toggle"><span>Microphone</span><div class="sw"></div></div>
      <div class="toggle on"><span>Mouse FX</span><div class="sw"></div></div>
    </div>
    <div class="statusbar">
      <span class="cell">MP4</span><span class="cell">H.264</span><span class="cell">60 FPS</span><span class="cell">VBR · High</span>
      <span class="cell path">~/Movies/Rokuga</span>
    </div>
  </div>
</body>
</html>
