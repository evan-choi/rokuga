<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rokuga — Liquid Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;
    background:
      radial-gradient(1200px 800px at 20% 10%, #2b3a67 0%, transparent 60%),
      radial-gradient(1000px 700px at 85% 30%, #6a3aa0 0%, transparent 55%),
      radial-gradient(900px 900px at 50% 100%, #0e5f74 0%, transparent 60%),
      #0a0f1e;
    background-attachment:fixed;
  }
  .badge { position:fixed; top:16px; left:16px; color:#fff; font-size:13px; font-weight:600; background:rgba(255,255,255,.1); backdrop-filter:blur(12px); padding:6px 14px; border-radius:99px; border:1px solid rgba(255,255,255,.22); }
  .window {
    width:780px; border-radius:32px; color:#f5f7ff; position:relative; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 40%, rgba(255,255,255,.10));
    backdrop-filter:blur(40px) saturate(180%);
    border:1.5px solid transparent;
    background-clip:padding-box;
    box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1.5px 1px rgba(255,255,255,.45), inset 0 -1px 1px rgba(255,255,255,.12);
  }
  .window::before {
    content:''; position:absolute; inset:0; border-radius:32px; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.35) 0%, transparent 18%, transparent 78%, rgba(255,255,255,.18) 100%);
    mix-blend-mode:screen;
  }
  .titlebar { display:flex; align-items:center; gap:8px; padding:16px 20px 10px; }
  .dot { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 1px 1px rgba(255,255,255,.5); }
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .title { flex:1; text-align:center; font-size:13px; font-weight:600; opacity:.85; margin-right:56px; }
  .modes { display:flex; gap:10px; padding:14px 24px 6px; }
  .mode {
    flex:1; border-radius:20px; padding:16px 8px; text-align:center; cursor:pointer; position:relative;
    background:linear-gradient(170deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    transition:.25s;
  }
  .mode.active {
    background:linear-gradient(170deg, rgba(120,190,255,.34), rgba(120,190,255,.10));
    border-color:rgba(160,215,255,.55);
    box-shadow:0 6px 28px rgba(90,170,255,.25), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .mode .icon{font-size:24px} .mode .label{font-size:12px; font-weight:600; margin-top:8px}
  .preview {
    margin:16px 24px; height:230px; border-radius:24px; position:relative;
    background:rgba(2,6,18,.5);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 2px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .preview::after { content:''; position:absolute; top:0; left:8%; right:40%; height:46%; border-radius:0 0 100% 100%/0 0 60px 60px;
    background:linear-gradient(rgba(255,255,255,.10), transparent); pointer-events:none; }
  .hint{font-size:13px; opacity:.6}
  .marquee { position:absolute; inset:38px 70px; border:2px solid rgba(140,200,255,.9); border-radius:10px; box-shadow:0 0 0 4000px rgba(0,0,0,.28), 0 0 24px rgba(120,190,255,.45); }
  .handle { position:absolute; width:9px; height:9px; background:#cfe9ff; border-radius:3px; }
  .h1{top:-5px;left:-5px}.h2{top:-5px;right:-5px}.h3{bottom:-5px;left:-5px}.h4{bottom:-5px;right:-5px}
  .dims { position:absolute; top:10px; left:74px; font-size:11px; background:rgba(10,20,40,.7); border:1px solid rgba(255,255,255,.2); padding:3px 9px; border-radius:99px; }
  .timer { position:absolute; bottom:12px; right:14px; font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; background:rgba(10,20,40,.7); border:1px solid rgba(255,255,255,.2); padding:5px 13px; border-radius:99px; }
  .timer::before{content:'●'; color:#ff4d4d; margin-right:8px; animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .controls { display:flex; align-items:center; gap:14px; padding:6px 24px; }
  .rec {
    width:68px; height:68px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:radial-gradient(circle at 32% 28%, #ff8a80, #e5484d 62%, #b3261e);
    box-shadow:0 12px 36px rgba(229,72,77,.45), inset 0 2px 2px rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,0,0,.3);
  }
  .rec .inner{position:absolute; inset:22px; border-radius:50%; background:linear-gradient(#fff,#ffe3e1)}
  .ctl {
    width:48px; height:48px; border-radius:50%; cursor:pointer; color:#fff; font-size:16px;
    background:linear-gradient(170deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  }
  .spacer{flex:1}
  .toggle {
    display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:600; padding:10px 14px; border-radius:99px; cursor:pointer;
    background:linear-gradient(170deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
  }
  .toggle+.toggle{margin-left:8px}
  .sw{width:30px;height:17px;border-radius:99px;background:rgba(255,255,255,.25);position:relative;transition:.2s}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .toggle.on .sw{background:linear-gradient(#5ee0a0,#2ebd7f)}
  .toggle.on .sw::after{transform:translateX(13px)}
  .statusbar{display:flex;align-items:center;gap:12px;padding:16px 26px 22px;font-size:12px;opacity:.9}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:99px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
  .path{margin-left:auto;opacity:.65}
</style>
</head>
<body>
  <div class="badge">02 · Liquid Glass (Apple 2025)</div>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="title">Rokuga</div>
    </div>
    <div class="modes">
      <div class="mode active"><div class="icon">⬚</div><div class="label">Selected Area</div></div>
      <div class="mode"><div class="icon">🖥</div><div class="label">Full Screen</div></div>
      <div class="mode"><div class="icon">🗔</div><div class="label">Window</div></div>
      <div class="mode"><div class="icon">📷</div><div class="label">Camera</div></div>
    </div>
    <div class="preview">
      <div class="marquee">
        <div class="handle h1"></div><div class="handle h2"></div><div class="handle h3"></div><div class="handle h4"></div>
      </div>
      <div class="dims">1280 × 720</div>
      <div class="hint">Drag to select an area of the screen</div>
      <div class="timer">00:01:24</div>
    </div>
    <div class="controls">
      <button class="rec"><div class="inner"></div></button>
      <button class="ctl">⏸</button>
      <button class="ctl">⏹</button>
      <div class="spacer"></div>
      <div class="toggle on"><span>🔊 System Audio</span><div class="sw"></div></div>
      <div class="toggle"><span>🎙 Microphone</span><div class="sw"></div></div>
      <div class="toggle on"><span>🖱 Mouse FX</span><div class="sw"></div></div>
    </div>
    <div class="statusbar">
      <span class="chip">MP4</span><span class="chip">H.264</span><span class="chip">60 FPS</span><span class="chip">VBR · High</span>
      <span class="path">~/Movies/Rokuga</span>
    </div>
  </div>
</body>
</html>
