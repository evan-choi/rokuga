<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rokuga — Neubrutalism</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk',sans-serif; }
  :root { --bg:#f5f0e6; --ink:#111111; --yellow:#ffd93d; --pink:#ff90e8; --green:#4de19c; --blue:#69c7ff; --red:#ff5252; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; background:var(--bg);
    background-image:radial-gradient(#11111114 1.5px, transparent 1.5px); background-size:22px 22px; color:var(--ink); }
  .badge { position:fixed; top:16px; left:16px; font-size:13px; font-weight:700; background:var(--yellow); border:3px solid var(--ink); padding:7px 14px; box-shadow:4px 4px 0 var(--ink); }
  .window { width:770px; background:#fff; border:3px solid var(--ink); box-shadow:12px 12px 0 var(--ink); }
  .titlebar { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:3px solid var(--ink); background:var(--yellow); }
  .dot { width:16px; height:16px; border-radius:50%; border:2.5px solid var(--ink); background:#fff; }
  .dot.r{background:var(--red)}.dot.y{background:#fff}.dot.g{background:var(--green)}
  .title { flex:1; text-align:center; font-family:'Archivo Black'; font-size:16px; letter-spacing:.02em; margin-right:70px; text-transform:uppercase; }
  .modes { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:20px 22px 6px; }
  .mode { border:3px solid var(--ink); padding:14px 8px; text-align:center; cursor:pointer; background:#fff; box-shadow:5px 5px 0 var(--ink); transition:.1s; }
  .mode:hover{transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink)}
  .mode.active { background:var(--pink); transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink); }
  .mode .icon{font-size:24px} .mode .label{font-size:12.5px; font-weight:700; margin-top:6px; text-transform:uppercase}
  .preview { margin:18px 22px; height:215px; border:3px solid var(--ink); position:relative; background:var(--blue);
    display:flex; align-items:center; justify-content:center; }
  .hint{font-size:14px; font-weight:700; background:#fff; border:2.5px solid var(--ink); padding:6px 12px; box-shadow:4px 4px 0 var(--ink);}
  .marquee { position:absolute; inset:32px 60px; border:3px dashed var(--ink); background:#ffffff55; }
  .dims { position:absolute; top:-16px; left:80px; font-size:12px; font-weight:700; background:var(--green); border:2.5px solid var(--ink); padding:3px 10px; box-shadow:3px 3px 0 var(--ink); }
  .timer { position:absolute; bottom:-18px; right:16px; font-variant-numeric:tabular-nums; font-family:'Archivo Black'; font-size:18px; background:#fff; border:3px solid var(--ink); padding:5px 14px; box-shadow:4px 4px 0 var(--ink); }
  .timer::before{content:'●'; color:var(--red); margin-right:8px; animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.15}}
  .controls { display:flex; align-items:center; gap:14px; padding:18px 22px 4px; }
  .rec { display:flex; align-items:center; gap:10px; cursor:pointer; padding:0 24px; height:54px;
    background:var(--red); color:#fff; font-family:'Archivo Black'; font-size:16px; letter-spacing:.03em;
    border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); transition:.1s; text-transform:uppercase; }
  .rec:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink)}
  .rec .d{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
  .ctl { width:54px; height:54px; cursor:pointer; font-size:17px; background:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink); transition:.1s; }
  .ctl:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink)}
  .spacer{flex:1}
  .toggle { display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:700; padding:11px 13px; cursor:pointer; background:#fff; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); text-transform:uppercase; }
  .toggle+.toggle{margin-left:10px}
  .toggle.on{background:var(--green)}
  .box{width:18px;height:18px;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
  .statusbar{display:flex;align-items:center;gap:12px;padding:18px 22px 22px;font-size:12.5px;font-weight:700}
  .chip{border:2.5px solid var(--ink);padding:5px 11px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);text-transform:uppercase}
  .path{margin-left:auto;background:#fff}
</style>
</head>
<body>
  <div class="badge">06 · Neubrutalism</div>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="title">Rokuga</div>
    </div>
    <div class="modes">
      <div class="mode active"><div class="icon">⬚</div><div class="label">Area</div></div>
      <div class="mode"><div class="icon">🖥</div><div class="label">Screen</div></div>
      <div class="mode"><div class="icon">🗔</div><div class="label">Window</div></div>
      <div class="mode"><div class="icon">📷</div><div class="label">Camera</div></div>
    </div>
    <div class="preview">
      <div class="marquee"></div>
      <div class="dims">1280 × 720</div>
      <div class="hint">DRAG TO SELECT AREA!</div>
      <div class="timer">00:01:24</div>
    </div>
    <div class="controls">
      <button class="rec"><span class="d"></span>REC</button>
      <button class="ctl">⏸</button>
      <button class="ctl">⏹</button>
      <div class="spacer"></div>
      <div class="toggle on"><div class="box">✓</div><span>Audio</span></div>
      <div class="toggle"><div class="box"></div><span>Mic</span></div>
      <div class="toggle on"><div class="box">✓</div><span>Mouse</span></div>
    </div>
    <div class="statusbar">
      <span class="chip">MP4</span><span class="chip">H.264</span><span class="chip">60FPS</span><span class="chip">HIGH</span>
      <span class="chip path">~/Movies/Rokuga</span>
    </div>
  </div>
</body>
</html>
