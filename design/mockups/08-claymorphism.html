<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rokuga — Claymorphism</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',-apple-system,sans-serif; }
  :root { --bg:#eef2ff; --card:#ffffff; --txt:#3f4370; --sub:#8b90bb; --accent:#ff6b6b; --mint:#63e6be; --lav:#b197fc; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; background:linear-gradient(160deg,#e7ecff,#fdeff6); color:var(--txt); }
  .badge { position:fixed; top:16px; left:16px; font-size:13px; font-weight:800; color:var(--txt); background:#fff; padding:8px 16px; border-radius:99px;
    box-shadow:0 8px 20px #b197fc33, inset 0 -4px 8px #eef; }
  .window { width:770px; border-radius:36px; background:var(--card); padding:6px;
    box-shadow:0 30px 60px #b197fc3d, inset 0 -10px 20px #e8ebff, inset 0 6px 12px #ffffff; }
  .titlebar { display:flex; align-items:center; gap:9px; padding:20px 24px 6px; }
  .dot { width:14px; height:14px; border-radius:50%; box-shadow:inset 0 -3px 5px rgba(0,0,0,.12), inset 0 2px 3px rgba(255,255,255,.8); }
  .dot.r{background:#ff8787}.dot.y{background:#ffd43b}.dot.g{background:#69db7c}
  .title { flex:1; text-align:center; font-size:15px; font-weight:900; margin-right:62px; color:var(--txt); }
  .modes { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:16px 26px 4px; }
  .mode { border-radius:24px; padding:16px 8px; text-align:center; cursor:pointer; background:#f4f6ff;
    box-shadow:0 10px 20px #b197fc26, inset 0 -6px 10px #e2e6fa, inset 0 4px 6px #ffffff; transition:.2s; }
  .mode:hover{transform:translateY(-3px)}
  .mode.active { background:linear-gradient(160deg,#c3b4ff,#a78bfa); color:#fff;
    box-shadow:0 14px 28px #a78bfa66, inset 0 -6px 12px #8d6ee8, inset 0 4px 6px #d8ccff; }
  .mode .icon{font-size:26px} .mode .label{font-size:12.5px; font-weight:800; margin-top:7px}
  .preview { margin:20px 26px; height:215px; border-radius:28px; position:relative; background:#f0f3ff;
    box-shadow:inset 0 8px 16px #d5dbf5, inset 0 -4px 8px #ffffff;
    display:flex; align-items:center; justify-content:center; }
  .hint{font-size:13.5px; color:var(--sub); font-weight:800}
  .marquee { position:absolute; inset:36px 68px; border:3px dashed #b197fc; border-radius:18px; background:#ffffff66; }
  .dims { position:absolute; top:14px; left:74px; font-size:11.5px; font-weight:900; background:#fff; color:var(--txt); padding:5px 12px; border-radius:99px;
    box-shadow:0 6px 12px #b197fc33; }
  .timer { position:absolute; bottom:14px; right:16px; font-variant-numeric:tabular-nums; font-weight:900; font-size:15px; background:#fff; padding:7px 15px; border-radius:99px;
    box-shadow:0 6px 12px #b197fc33; }
  .timer::before{content:'●'; color:var(--accent); margin-right:8px; animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .controls { display:flex; align-items:center; gap:16px; padding:4px 26px; }
  .rec { width:72px; height:72px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(160deg,#ff8787,#fa5252);
    box-shadow:0 16px 30px #fa525266, inset 0 -8px 14px #e03131, inset 0 6px 8px #ffb3b3;
    display:flex; align-items:center; justify-content:center; transition:.15s; }
  .rec:active{transform:scale(.94)}
  .rec .inner{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #c92a2a66}
  .ctl { width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; font-size:16px; color:var(--txt); background:#fff;
    box-shadow:0 10px 18px #b197fc30, inset 0 -5px 8px #e8ebff, inset 0 3px 5px #ffffff; }
  .spacer{flex:1}
  .toggle { display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:800; padding:12px 16px; border-radius:20px; cursor:pointer; background:#fff;
    box-shadow:0 8px 16px #b197fc26, inset 0 -4px 8px #eef0ff, inset 0 3px 4px #ffffff; }
  .toggle+.toggle{margin-left:10px}
  .sw{width:34px;height:20px;border-radius:99px;background:#e3e7fb;position:relative;transition:.2s;box-shadow:inset 0 3px 6px #c9cfec}
  .sw::after{content:'';position:absolute;top:2.5px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px #9aa}
  .toggle.on .sw{background:var(--mint);box-shadow:inset 0 3px 6px #38d9a9}
  .toggle.on .sw::after{transform:translateX(13px)}
  .statusbar{display:flex;align-items:center;gap:13px;padding:20px 30px 26px;font-size:12.5px;font-weight:800;color:var(--sub)}
  .chip{background:#f4f6ff;padding:7px 14px;border-radius:99px;color:var(--txt);box-shadow:inset 0 -3px 6px #e2e6fa, inset 0 2px 4px #fff, 0 4px 10px #b197fc1f}
  .path{margin-left:auto}
</style>
</head>
<body>
  <div class="badge">08 · Claymorphism</div>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="title">Rokuga</div>
    </div>
    <div class="modes">
      <div class="mode active"><div class="icon">⬚</div><div class="label">Selected Area</div></div>
      <div class="mode"><div class="icon">🖥</div><div class="label">Full Screen</div></div>
      <div class="mode"><div class="icon">🗔</div><div class="label">Window</div></div>
      <div class="mode"><div class="icon">📷</div><div class="label">Camera</div></div>
    </div>
    <div class="preview">
      <div class="marquee"></div>
      <div class="dims">1280 × 720</div>
      <div class="hint">Drag to select an area of the screen ✨</div>
      <div class="timer">00:01:24</div>
    </div>
    <div class="controls">
      <button class="rec"><div class="inner"></div></button>
      <button class="ctl">⏸</button>
      <button class="ctl">⏹</button>
      <div class="spacer"></div>
      <div class="toggle on"><span>🔊 Audio</span><div class="sw"></div></div>
      <div class="toggle"><span>🎙 Mic</span><div class="sw"></div></div>
      <div class="toggle on"><span>🖱 Mouse</span><div class="sw"></div></div>
    </div>
    <div class="statusbar">
      <span class="chip">MP4</span><span class="chip">H.264</span><span class="chip">60 FPS</span><span class="chip">High</span>
      <span class="path">~/Movies/Rokuga</span>
    </div>
  </div>
</body>
</html>
