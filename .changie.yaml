changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
  - label: Added
    key: added
    auto: minor
  - label: Changed
    key: changed
    auto: minor
  - label: Fixed
    key: fixed
    auto: patch
  - label: Removed
    key: removed
    auto: major
  - label: Security
    key: security
    auto: patch
newlines:
  afterChangelogHeader: 0
  beforeChangelogVersion: 1
  afterChangelogVersion: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 0
replacements:
  - path: project.yml
    find: '    MARKETING_VERSION: ".*"'
    replace: '    MARKETING_VERSION: "{{.VersionNoPrefix}}"'
